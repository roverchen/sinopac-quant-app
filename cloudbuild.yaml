steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-east1-docker.pkg.dev/$PROJECT_ID/sinopac-quant-repo/quant-pro', '.']

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-east1-docker.pkg.dev/$PROJECT_ID/sinopac-quant-repo/quant-pro']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quant-pro'
      - '--image'
      - 'asia-east1-docker.pkg.dev/$PROJECT_ID/sinopac-quant-repo/quant-pro'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'

  # 4. Clear historical local results on new deploy (v2.6.2+)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'gcloud storage rm gs://$PROJECT_ID-data/shared_results_*.pkl || exit 0'

images:
  - 'asia-east1-docker.pkg.dev/$PROJECT_ID/sinopac-quant-repo/quant-pro'

options:
  logging: CLOUD_LOGGING_ONLY
